# vanauto-api.neeklo.ru — Laravel (Che168 API)
# Install: /etc/nginx/sites-available/vanauto-api.neeklo.ru.conf
# Cert: certbot certonly --webroot -w /var/www/certbot -d vanauto-api.neeklo.ru

server {
    listen 80;
    listen [::]:80;
    server_name vanauto-api.neeklo.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vanauto-api.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/vanauto-api.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanauto-api.neeklo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vanauto-api.neeklo.ru/public;
    index index.php;
    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}