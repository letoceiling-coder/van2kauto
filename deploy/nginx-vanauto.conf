# VAN2KAUTO — статический экспорт Next.js. Выкладка: van2kauto/deploy/deploy.sh
server {
    listen 80;
    listen [::]:80;
    server_name vanauto.neeklo.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name vanauto.neeklo.ru;
    ssl_certificate /etc/letsencrypt/live/vanauto.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanauto.neeklo.ru/privkey.pem;

    root /var/www/vanauto.neeklo.ru;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /media/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}
